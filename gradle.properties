org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Gradle 9 pulled in JDK 26; AGP is not compatible with it. Pin to a supported JDK.
#
# Deliberately not set here: an absolute path only valid on one machine breaks every other one,
# and this repo is now built from both macOS and Linux. Select the JDK per machine instead --
# either by having JAVA_HOME point at 21 (tools/deploy.sh discovers it), or by setting
# org.gradle.java.home in ~/.gradle/gradle.properties, which is per-user and not committed.
# The constraint itself is unchanged: AGP does not support JDK 26.
# org.gradle.java.home=/opt/homebrew/opt/openjdk@21

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
